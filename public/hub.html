<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SEED Lab — Mission Control</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f0f1a;
  min-height: 100vh;
  color: white;
}

/* ── LOCK SCREEN ── */
#lock-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 40px 24px;
  background: linear-gradient(160deg, #0f0f1a 0%, #1a1a3e 50%, #0f1a2e 100%);
}

.lock-logo { font-size: 3.5rem; margin-bottom: 12px; }
.lock-title {
  font-size: 1.8rem;
  font-weight: 800;
  background: linear-gradient(135deg, #a78bfa, #60a5fa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 4px;
}
.lock-sub { font-size: .85rem; color: rgba(255,255,255,.5); margin-bottom: 48px; }

.lock-box {
  background: rgba(255,255,255,.06);
  border-radius: 24px;
  padding: 32px 28px;
  width: 100%;
  max-width: 340px;
  border: 1px solid rgba(255,255,255,.1);
  backdrop-filter: blur(20px);
}

.lock-label {
  font-size: .75rem;
  font-weight: 600;
  letter-spacing: .1em;
  color: rgba(255,255,255,.5);
  text-transform: uppercase;
  margin-bottom: 12px;
  text-align: center;
}

.pin-dots {
  display: flex;
  gap: 14px;
  justify-content: center;
  margin-bottom: 32px;
}

.pin-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.3);
  transition: all .2s;
}

.pin-dot.filled {
  background: #a78bfa;
  border-color: #a78bfa;
  box-shadow: 0 0 10px rgba(167,139,250,.5);
}

.pin-dot.error {
  background: #f87171;
  border-color: #f87171;
  box-shadow: 0 0 10px rgba(248,113,113,.5);
}

.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.key {
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 16px;
  color: white;
  font-size: 1.4rem;
  font-weight: 600;
  padding: 18px 0;
  cursor: pointer;
  transition: all .15s;
  user-select: none;
}

.key:active, .key.pressed {
  background: rgba(167,139,250,.25);
  border-color: #a78bfa;
  transform: scale(.95);
}

.key.del {
  font-size: 1rem;
  color: rgba(255,255,255,.6);
}

.key.empty { visibility: hidden; }

.lock-error {
  color: #f87171;
  font-size: .8rem;
  text-align: center;
  margin-top: 16px;
  min-height: 20px;
  opacity: 0;
  transition: opacity .3s;
}

.lock-error.show { opacity: 1; }

/* ── HUB ── */
#hub-screen {
  display: none;
  min-height: 100vh;
  background: linear-gradient(160deg, #0f0f1a 0%, #1a1a3e 50%, #0f1a2e 100%);
}

.hub-header {
  padding: 48px 24px 24px;
  text-align: center;
}

.hub-logo { font-size: 2.8rem; margin-bottom: 8px; }

.hub-title {
  font-size: 1.6rem;
  font-weight: 800;
  background: linear-gradient(135deg, #a78bfa, #60a5fa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 4px;
}

.hub-sub {
  font-size: .8rem;
  color: rgba(255,255,255,.4);
  letter-spacing: .08em;
  text-transform: uppercase;
}

.hub-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  padding: 16px 20px 40px;
}

.app-card {
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 24px;
  padding: 28px 20px 24px;
  text-decoration: none;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  transition: all .2s;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.app-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 24px;
  opacity: 0;
  transition: opacity .2s;
}

.app-card:active::before { opacity: 1; }

.app-card.purple::before { background: rgba(167,139,250,.15); }
.app-card.blue::before   { background: rgba(96,165,250,.15); }
.app-card.green::before  { background: rgba(52,211,153,.15); }
.app-card.orange::before { background: rgba(251,146,60,.15); }

.app-card:active { transform: scale(.97); }

.app-icon {
  font-size: 2.6rem;
  line-height: 1;
}

.app-icon-bg {
  width: 64px;
  height: 64px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
}

.bg-purple { background: rgba(167,139,250,.2); }
.bg-blue   { background: rgba(96,165,250,.2); }
.bg-green  { background: rgba(52,211,153,.2); }
.bg-orange { background: rgba(251,146,60,.2); }

.app-name {
  font-size: .85rem;
  font-weight: 700;
  text-align: center;
  line-height: 1.3;
  color: rgba(255,255,255,.9);
}

.app-tag {
  font-size: .65rem;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 3px 10px;
  border-radius: 20px;
}

.tag-purple { background: rgba(167,139,250,.2); color: #c4b5fd; }
.tag-blue   { background: rgba(96,165,250,.2);  color: #93c5fd; }
.tag-green  { background: rgba(52,211,153,.2);  color: #6ee7b7; }
.tag-orange { background: rgba(251,146,60,.2);  color: #fdba74; }

.hub-footer {
  text-align: center;
  padding: 0 20px 32px;
}

.lock-btn {
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.1);
  color: rgba(255,255,255,.4);
  font-size: .75rem;
  padding: 10px 24px;
  border-radius: 20px;
  cursor: pointer;
  letter-spacing: .06em;
}

.lock-btn:active { background: rgba(255,255,255,.1); }
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock-screen">
  <div class="lock-logo">🌱</div>
  <div class="lock-title">Mission Control</div>
  <div class="lock-sub">SEED Lab — Teacher Access</div>

  <div class="lock-box">
    <div class="lock-label">Enter PIN</div>
    <div class="pin-dots">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>
    <div class="keypad">
      <button class="key" onclick="pressKey('1')">1</button>
      <button class="key" onclick="pressKey('2')">2</button>
      <button class="key" onclick="pressKey('3')">3</button>
      <button class="key" onclick="pressKey('4')">4</button>
      <button class="key" onclick="pressKey('5')">5</button>
      <button class="key" onclick="pressKey('6')">6</button>
      <button class="key" onclick="pressKey('7')">7</button>
      <button class="key" onclick="pressKey('8')">8</button>
      <button class="key" onclick="pressKey('9')">9</button>
      <button class="key empty"></button>
      <button class="key" onclick="pressKey('0')">0</button>
      <button class="key del" onclick="deleteLast()">⌫</button>
    </div>
    <div class="lock-error" id="lock-error">Incorrect PIN — try again</div>
  </div>
</div>

<!-- HUB SCREEN -->
<div id="hub-screen">
  <div class="hub-header">
    <div class="hub-logo">🌱</div>
    <div class="hub-title">Mission Control</div>
    <div class="hub-sub">SEED Lab</div>
  </div>

  <div class="hub-grid">

    <a class="app-card purple" href="/circle-app.html">
      <div class="app-icon-bg bg-purple">🔵</div>
      <div class="app-name">Opening & Closing Circle</div>
      <div class="app-tag tag-purple">PE</div>
    </a>

    <a class="app-card blue" href="/pe-challenges.html">
      <div class="app-icon-bg bg-blue">🏆</div>
      <div class="app-name">PE Challenges</div>
      <div class="app-tag tag-blue">PE</div>
    </a>

    <a class="app-card green" href="/team-quest.html">
      <div class="app-icon-bg bg-green">⚔️</div>
      <div class="app-name">Team Quest</div>
      <div class="app-tag tag-green">PE</div>
    </a>

    <a class="app-card orange" href="/class-compass/">
      <div class="app-icon-bg bg-orange">🌿</div>
      <div class="app-name">Class Compass</div>
      <div class="app-tag tag-orange">Wellbeing</div>
    </a>

  </div>

  <div class="hub-footer">
    <button class="lock-btn" onclick="lockHub()">🔒 Lock</button>
  </div>
</div>

<script>
const PIN = '7333';
const SESSION_KEY = 'hub_unlocked';
let entered = '';

function checkSession() {
  if (sessionStorage.getItem(SESSION_KEY) === 'yes') showHub();
}

function pressKey(k) {
  if (entered.length >= 4) return;
  entered += k;
  updateDots();
  if (entered.length === 4) setTimeout(checkPin, 150);
}

function deleteLast() {
  entered = entered.slice(0, -1);
  updateDots();
  clearError();
}

function updateDots() {
  for (let i = 0; i < 4; i++) {
    document.getElementById('d' + i).className = 'pin-dot' + (i < entered.length ? ' filled' : '');
  }
}

function checkPin() {
  if (entered === PIN) {
    sessionStorage.setItem(SESSION_KEY, 'yes');
    showHub();
  } else {
    for (let i = 0; i < 4; i++) document.getElementById('d' + i).className = 'pin-dot error';
    document.getElementById('lock-error').classList.add('show');
    setTimeout(() => {
      entered = '';
      updateDots();
      clearError();
    }, 800);
  }
}

function clearError() {
  document.getElementById('lock-error').classList.remove('show');
}

function showHub() {
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('hub-screen').style.display = 'block';
}

function lockHub() {
  sessionStorage.removeItem(SESSION_KEY);
  entered = '';
  updateDots();
  document.getElementById('hub-screen').style.display = 'none';
  document.getElementById('lock-screen').style.display = 'flex';
}

checkSession();
</script>
</body>
</html>
