<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Team Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   TEACHER CONFIG (edit here)
   Password: seed2025
═══════════════════════════════════════ */

:root {
  --green-dark: #2D5016;
  --green-mid:  #4A7C2F;
  --green-light:#8DB87A;
  --cream:      #F5F0E8;
  --cream-dark: #E8DFC8;
  --terracotta: #C4622D;
  --terra-light:#E8916A;
  --gold:       #D4A017;
  --text:       #1A1A1A;
  --text-light: #5C5C5C;
  --white:      #FDFAF5;
  --error:      #B91C1C;
  --radius:     14px;
  --shadow:     0 2px 12px rgba(0,0,0,.1);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--cream);color:var(--text);font-family:'Inter',sans-serif;font-size:16px;overflow-x:hidden}

/* ── SCREENS ── */
.screen{display:none;flex-direction:column;min-height:100dvh}
.screen.active{display:flex}

/* ── TYPOGRAPHY ── */
h1,h2,h3,.brand{font-family:'Nunito',sans-serif}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 24px;border-radius:var(--radius);border:none;cursor:pointer;
  font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;
  transition:opacity .15s,transform .1s;min-height:48px;touch-action:manipulation}
.btn:active{opacity:.85;transform:scale(.97)}
.btn-primary{background:var(--green-mid);color:#fff}
.btn-secondary{background:var(--cream-dark);color:var(--green-dark)}
.btn-terra{background:var(--terracotta);color:#fff}
.btn-gold{background:var(--gold);color:#fff}
.btn-ghost{background:transparent;color:var(--green-mid);text-decoration:underline;padding:8px 12px}
.btn-sm{padding:9px 16px;font-size:.85rem;min-height:38px}
.btn-full{width:100%}

/* ── CARDS ── */
.card{background:var(--white);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}

/* ── PROGRESS BAR ── */
.prog-wrap{background:var(--cream-dark);border-radius:99px;overflow:hidden;height:10px}
.prog-bar{height:100%;border-radius:99px;background:var(--green-light);
  transition:width .6s cubic-bezier(.4,0,.2,1)}

/* ── LEVEL BADGE ── */
.level-badge{display:inline-flex;align-items:center;gap:5px;
  background:var(--green-mid);color:#fff;border-radius:99px;
  padding:4px 12px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.8rem}

/* ── MODAL OVERLAY ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);
  display:none;align-items:flex-end;justify-content:center;z-index:100;
  padding:16px}
.modal-overlay.open{display:flex}
.modal-box{background:var(--white);border-radius:20px 20px 0 0;
  width:100%;max-width:540px;max-height:88dvh;overflow-y:auto;
  padding:24px 20px 32px}
.modal-handle{width:40px;height:4px;background:var(--cream-dark);
  border-radius:99px;margin:0 auto 18px}

/* ── FORM ELEMENTS ── */
.field-label{font-size:.78rem;font-weight:700;color:var(--text-light);
  text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;display:block}
.field-input,.field-select,.field-textarea{
  width:100%;padding:13px 14px;border:2px solid var(--cream-dark);
  border-radius:var(--radius);font-family:'Inter',sans-serif;font-size:1rem;
  color:var(--text);background:var(--white);outline:none;
  transition:border-color .2s}
.field-input:focus,.field-select:focus,.field-textarea:focus{border-color:var(--green-mid)}
.field-textarea{resize:vertical;min-height:90px}
.field-group{margin-bottom:16px}

/* ── BACK BUTTON ── */
.back-btn{background:none;border:none;cursor:pointer;
  display:flex;align-items:center;gap:6px;
  font-family:'Nunito',sans-serif;font-weight:700;font-size:.9rem;
  color:var(--green-dark);padding:10px 0;min-height:44px}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;
  background:var(--white);border-top:2px solid var(--cream-dark);
  display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:10px 4px;gap:3px;border:none;
  background:transparent;cursor:pointer;font-family:'Inter',sans-serif;
  font-size:.68rem;font-weight:600;color:var(--text-light);min-height:58px}
.nav-tab.active{color:var(--green-mid)}
.nav-tab .nav-icon{font-size:1.3rem}

/* ════════════════════════════════
   LANDING SCREEN
════════════════════════════════ */
#screen-landing{
  background:linear-gradient(160deg,var(--green-dark) 0%,var(--green-mid) 100%);
  align-items:center;justify-content:center;text-align:center;padding:32px 24px;
}
.landing-logo{font-size:3rem;margin-bottom:4px}
.landing-title{font-family:'Nunito',sans-serif;font-weight:900;
  font-size:2.8rem;color:#fff;letter-spacing:-1px;line-height:1.1}
.landing-sub{font-family:'Nunito',sans-serif;font-weight:700;
  font-size:1rem;color:rgba(255,255,255,.75);margin:6px 0 32px}
.landing-unit{background:rgba(255,255,255,.12);border-radius:12px;
  padding:10px 20px;color:rgba(255,255,255,.9);font-weight:600;
  font-size:.9rem;margin-bottom:32px;border:1px solid rgba(255,255,255,.2)}
.landing-no-unit{color:rgba(255,255,255,.6);font-size:.95rem;
  padding:20px;border:2px dashed rgba(255,255,255,.3);border-radius:var(--radius);
  margin-bottom:32px}
.landing-actions{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px}
.landing-team-btn{
  background:#fff;color:var(--green-dark);font-family:'Nunito',sans-serif;
  font-weight:900;font-size:1.2rem;padding:18px 24px;border-radius:var(--radius);
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.2);transition:transform .1s,opacity .15s;
  min-height:60px}
.landing-team-btn:active{transform:scale(.97);opacity:.9}
.landing-footer{margin-top:auto;padding-top:24px;
  color:rgba(255,255,255,.45);font-size:.72rem}

/* ════════════════════════════════
   TEAM LOGIN SCREEN
════════════════════════════════ */
#screen-team-login{background:var(--cream)}
.team-login-header{background:var(--green-dark);color:#fff;
  padding:20px 20px 24px;text-align:center}
.team-login-header h2{font-family:'Nunito',sans-serif;font-weight:800;font-size:1.5rem}
.team-login-header p{font-size:.85rem;opacity:.75;margin-top:4px}
.team-grid{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px;
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:24px}
.team-card{background:var(--white);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);cursor:pointer;
  transition:transform .15s,box-shadow .15s;border:2px solid transparent}
.team-card:active{transform:scale(.97);box-shadow:none}
.team-card-strip{height:8px}
.team-card-body{padding:14px 12px 12px}
.team-card-name{font-family:'Nunito',sans-serif;font-weight:800;
  font-size:1.05rem;color:var(--green-dark);margin-bottom:6px}
.team-card-level{margin-bottom:8px}
.team-card-prog{margin-top:6px}
.team-card-prog-label{font-size:.68rem;color:var(--text-light);margin-bottom:3px}

/* ── SYNC STATUS ── */
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;
  background:var(--green-light);margin-right:5px}
.sync-dot.warn{background:var(--gold)}
.sync-dot.err{background:var(--error)}
</style>
</head>

// ─── LocalStorage ───────────────────────────
function loadState(){
  try{
    const saved = localStorage.getItem('teamquest_state');
    if(saved){
      const parsed = JSON.parse(saved);
      appState = Object.assign(appState, parsed);
      appState.teacherAuth = sessionStorage.getItem('tqTeacherAuth')==='true';
    }
  }catch(e){console.warn('State load failed',e)}
}
function saveState(){
  try{
    const toSave = {...appState, teacherAuth:false};
    localStorage.setItem('teamquest_state', JSON.stringify(toSave));
  }catch(e){console.warn('State save failed',e)}
}
function setState(patch){
  Object.assign(appState, patch);
  saveState();
}
function getTeam(id){ return appState.teams.find(t=>t.id===id) }
function updateTeam(id, patch){
  const idx = appState.teams.findIndex(t=>t.id===id);
  if(idx<0) return;
  appState.teams[idx] = {...appState.teams[idx], ...patch,
    last_updated: new Date().toISOString()};
  saveState();
}
function getGrade(){ return appState.unit.grade || 'G3' }
function getText(key){ return (GRADE_CONFIG[getGrade()]?.strings?.[key]) || '' }
function getChallenges(type){
  const g = getGrade();
  const lib = type==='physical' ? PHYSICAL_CHALLENGES : COLLAB_CHALLENGES;
  return lib.filter(c=>c.grade_band.includes(g));
}
function makeLevelBadge(level, colour){
  const lv = LEVELS[level-1] || LEVELS[0];
  const bg = colour || 'var(--green-mid)';
  return `<span class="level-badge" style="background:${bg}">${lv.icon} ${lv.name}</span>`;
}
function starsHTML(tier){
  return '⭐'.repeat(tier) + '<span style="opacity:.25">⭐</span>'.repeat(3-tier);
}
function getNextLevel(team){
  return LEVELS.find(l=>l.level > team.level) || null;
}
function teamProgress(team){
  const next = getNextLevel(team);
  if(!next) return {pct:100, physPct:100, collabPct:100, next:null};
  const physPct  = Math.min(100, Math.round((team.approvedPhysical  / next.physical)*100));
  const collabPct= Math.min(100, Math.round((team.approvedCollaboration / next.collab)*100));
  const pct = Math.min(physPct, collabPct);
  return {pct, physPct, collabPct, next};
}

// ─── Apps Script sync ────────────────────────
function getScriptUrl(){
  return appState.unit.appsScriptUrl || DEFAULT_APPS_SCRIPT_URL || '';
}
async function syncToSheets(payload){
  const url = getScriptUrl();
  if(!url) return;
  try{
    await fetch(url,{method:'POST',mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)});
  }catch(e){
    console.warn('Sync failed — queuing',e);
    appState.pendingSync.push({payload, ts:new Date().toISOString()});
    saveState();
  }
}
async function fetchFromSheets(){
  const url = getScriptUrl();
  if(!url) return null;
  try{
    const res = await fetch(url+'?action=read');
    return await res.json();
  }catch(e){console.warn('Fetch failed',e);return null}
}
async function replayPendingSync(){
  if(!appState.pendingSync.length) return;
  const queue = [...appState.pendingSync];
  appState.pendingSync=[];
  saveState();
  for(const item of queue){ await syncToSheets(item.payload) }
}

function selectTeam(id){
  appState.activeTeamId = id;
  saveState();
  const team = getTeam(id);
  if(!team) return;
  if(team.levelUpPending){
    updateTeam(id,{levelUpPending:false});
    showScreen('team-home',{teamId:id});
    setTimeout(()=>triggerLevelUp(id),400);
  } else if(team.badgePending){
    const badge = team.badgePending;
    updateTeam(id,{badgePending:null});
    if(!team.charterSet){ showScreen('charter',{teamId:id}); }
    else { showScreen('team-home',{teamId:id}); }
    setTimeout(()=>triggerBadgeOverlay(badge, team.colour),400);
  } else if(!team.charterSet){
    showScreen('charter',{teamId:id});
  } else {
    showScreen('team-home',{teamId:id});
  }
}

function esc(str){ // basic XSS escape
  return String(str||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function newUUID(){ return crypto.randomUUID() }
function nowISO(){ return new Date().toISOString() }
function fmtDate(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

// ─── AUTO BADGE CHECK ─────────────────────────
function checkAutoBadges(teamId){
  const team = getTeam(teamId);
  if(!team) return;
  const total = (team.approvedPhysical||0)+(team.approvedCollaboration||0);
  const existing = (team.badges||[]).map(b=>b.id);
  const toAward = [];
  if(total>=1  && !existing.includes('first_challenge')) toAward.push('first_challenge');
  if(total>=5  && !existing.includes('five_done'))       toAward.push('five_done');
  if(total>=10 && !existing.includes('double_digits'))   toAward.push('double_digits');
  if(team.level>=3 && !existing.includes('halfway_hero'))toAward.push('halfway_hero');
  if(team.level>=5 && !existing.includes('thrive_crew')) toAward.push('thrive_crew');
  if(team.charterSet && !existing.includes('charter_team')) toAward.push('charter_team');
  toAward.forEach(bid=>{
    const def = AUTO_BADGES.find(b=>b.id===bid);
    if(!def) return;
    const badge = {id:newUUID(),badgeDefId:bid,name:def.name,icon:def.icon,
      type:'auto',awardedAt:nowISO()};
    const badges = [...(team.badges||[]), badge];
    updateTeam(teamId,{badges});
    syncToSheets({type:'badge_award',team_id:teamId,...badge});
  });
}

// ─── LEVEL UP CHECK ───────────────────────────
function checkLevelUp(teamId){
  const team = getTeam(teamId);
  if(!team || team.level>=5) return false;
  const nextLv = LEVELS.find(l=>l.level === team.level+1);
  if(!nextLv) return false;
  const meetsPhys   = team.approvedPhysical >= nextLv.physical;
  const meetsCollab = team.approvedCollaboration >= nextLv.collab;
  // Extra unlock conditions
  const goals = team.goals||[];
  const hasGoalCheckin = goals.some(g=>g.goals_set_at && g.checkin_at);
  const weeksWithGoals = new Set(goals.filter(g=>g.goals_set_at).map(g=>g.week_number)).size;
  const hasReflection  = goals.some(g=>g.reflection_at);
  const fullReflections= goals.filter(g=>g.reflection_wellbeing&&g.reflection_challenge&&g.lp_attribute_shown).length;
  let meetsExtra = true;
  if(nextLv.level===2) meetsExtra = hasGoalCheckin;
  if(nextLv.level===3) meetsExtra = weeksWithGoals>=2;
  if(nextLv.level===4) meetsExtra = hasReflection;
  if(nextLv.level===5) meetsExtra = fullReflections>=2;
  if(meetsPhys && meetsCollab && meetsExtra){
    updateTeam(teamId,{level:nextLv.level, levelUpPending:true});
    checkAutoBadges(teamId);
    syncToSheets({type:'team_setup', team_id:teamId, current_level:nextLv.level});
    return true;
  }
  return false;
}

function difficultyLabel(d){
  const map={easy:'😊 Easy',medium:'💪 Medium',challenge:'🔥 Challenge'};
  return map[d]||d;
}
function goalStatusBadge(goal, type){
  const achieved = goal[type+'_achieved'];
  const checkin  = goal[type+'_checkin'];
  if(achieved) return `<span style="font-size:.72rem;background:var(--green-light);color:var(--green-dark);border-radius:99px;padding:3px 10px;display:inline-block;margin-top:6px">✓ ${achieved==='yes'?'Achieved':achieved==='partial'?'Partially':'Not achieved'}</span>`;
  if(checkin)  return `<span style="font-size:.72rem;background:var(--cream-dark);color:var(--text-light);border-radius:99px;padding:3px 10px;display:inline-block;margin-top:6px">Checked in: ${checkin==='on_track'?'On track ✅':checkin==='sort_of'?'Sort of 🟡':'Need help 🆘'}</span>`;
  return `<span style="font-size:.72rem;color:var(--text-light);display:inline-block;margin-top:4px">Set this week</span>`;
}

function challengeStatus(team, challengeId){
  const pending  = (team.pendingChallenges||[]).find(c=>c.challenge_id===challengeId);
  const approved = (team.approvedChallenges||[]).find(c=>c.challenge_id===challengeId);
  if(approved) return 'approved';
  if(pending)  return 'pending';
  return 'available';
}
function statusChip(status){
  if(status==='approved') return `<span style="font-size:.72rem;background:var(--green-light);color:var(--green-dark);border-radius:99px;padding:3px 10px">✓ Completed</span>`;
  if(status==='pending')  return `<span style="font-size:.72rem;background:var(--cream-dark);color:var(--text-light);border-radius:99px;padding:3px 10px">⏳ Pending</span>`;
  return `<span style="font-size:.72rem;background:var(--green-mid);color:#fff;border-radius:99px;padding:3px 10px">Available</span>`;
}

        This is our team! ✊</button>
    </div>`;

  window._charterSelected = [];
}

function toggleCharter(el, teamId){
  const team = getTeam(teamId);
  const val = el.dataset.value;
  const sel = window._charterSelected||[];
  const idx = sel.indexOf(val);
  if(idx>-1){
    sel.splice(idx,1);
    el.style.background='var(--white)';
    el.style.borderColor='transparent';
    el.style.transform='';
  } else {
    if(sel.length>=3) return;
    sel.push(val);
    el.style.background=team.colour+'22';
    el.style.borderColor=team.colour;
    el.style.transform='scale(1.04)';
  }
  window._charterSelected = sel;
  const count = document.getElementById('charter-count');
  const btn   = document.getElementById('charter-confirm-btn');
  if(count) count.textContent=`Select 3 values (${sel.length} selected)`;
  if(btn){ btn.disabled=sel.length!==3; btn.style.opacity=sel.length===3?'1':'.4'; }
}

function confirmCharter(teamId){
  const vals = window._charterSelected||[];
  if(vals.length!==3) return;
  updateTeam(teamId,{charterValues:vals, charterSet:true});
  checkAutoBadges(teamId);
  syncToSheets({type:'team_setup',team_id:teamId,charter_values:vals.join('|')});
  showScreen('team-home',{teamId});
}

function openLogChallenge(teamId, challengeId, type){
  const team = getTeam(teamId);
  if(!team) return;
  const lib  = type==='physical' ? PHYSICAL_CHALLENGES : COLLAB_CHALLENGES;
  const ch   = lib.find(c=>c.id===challengeId);
  if(!ch) return;
  const grade = getGrade();
  const cfg   = GRADE_CONFIG[grade]||GRADE_CONFIG.G3;
  const prompt= getText('challengeLog');
  const showName = cfg.showStudentName;
  const roster = team.roster||[];

  document.getElementById('modal-log-challenge-content').innerHTML=`
    <h2 style="font-family:'Nunito',sans-serif;font-weight:900;color:var(--green-dark);font-size:1.2rem;margin-bottom:4px">
      ${esc(ch.name)}</h2>
    <p style="font-size:.85rem;color:var(--text-light);margin-bottom:16px;line-height:1.4">
      ${esc(ch.desc||ch.description||'')}</p>

      <label class="field-label">${prompt}</label>
      <textarea id="log-reflection" class="field-textarea" placeholder="Tell your teacher what happened..."></textarea>
    </div>
    ${roster.length && showName ? `
      <div class="field-group">
        <label class="field-label">Who helped most? (optional)</label>
        <select id="log-helper" class="field-select">
          <option value="">— choose a teammate —</option>
          ${roster.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}
        </select>
      </div>` : ''}
    ${showName ? `
      <div class="field-group">
        <label class="field-label">Your name (optional)</label>
        <input id="log-submitter" type="text" class="field-input" placeholder="Type your name">
      </div>` : ''}
    <div id="log-error" style="color:var(--error);font-size:.8rem;min-height:18px;margin-bottom:8px"></div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-secondary" style="flex:1" onclick="closeModal('modal-log-challenge')">Cancel</button>
      <button class="btn btn-primary" style="flex:1"
        onclick="submitChallenge('${teamId}','${challengeId}','${type}')">
        Submit ✓</button>
    </div>`;

  window._logTarget = {teamId, challengeId, type, ch};
  openModal('modal-log-challenge');
}

function submitChallenge(teamId, challengeId, type){
  const reflection = document.getElementById('log-reflection')?.value?.trim();
  if(!reflection){
    document.getElementById('log-error').textContent='Please write something before submitting!';
    return;
  }
  const helper    = document.getElementById('log-helper')?.value||'';
  const submitter = document.getElementById('log-submitter')?.value?.trim()||'';
  const team = getTeam(teamId);
  const lib  = type==='physical' ? PHYSICAL_CHALLENGES : COLLAB_CHALLENGES;
  const ch   = lib.find(c=>c.id===challengeId);
  if(!team||!ch) return;

  const submission = {
    submission_id: newUUID(),
    challenge_id: challengeId,
    challenge_name: ch.name,
    challenge_type: type,
    atl_skill: ch.atl||'',
    lp_attribute: ch.lp||'',
    difficulty: ch.tier,
    reflection_text: reflection,
    submitted_by: submitter,
    helper_name: helper,
    submitted_at: nowISO(),
    status: 'pending',
  };

  const pending = [...(team.pendingChallenges||[]), submission];
  updateTeam(teamId,{pendingChallenges: pending});
  syncToSheets({type:'challenge_submission', team_id:teamId, ...submission});
  closeModal('modal-log-challenge');

  // Refresh the current screen
  const s = appState.activeScreen;
  if(s==='team-home') renderTeamHome(teamId);
  else if(s==='challenges') renderChallenges(teamId, type);
}

function selectPreset(btn, targetId){
  // Deselect siblings
  btn.closest('[id$="-presets"]')?.querySelectorAll('.preset-btn').forEach(b=>{
    b.style.background='var(--cream-dark)';
    b.style.borderColor='transparent';
  });
  btn.style.background='var(--green-mid)22';
  btn.style.borderColor='var(--green-mid)';
  const hidden = document.getElementById(targetId);
  if(hidden) hidden.value = btn.dataset.value;
}

function selectDiff(btn, targetId){
  btn.closest('[id$="-wrap"]')?.querySelectorAll('button[type="button"]').forEach(b=>{
    b.style.background='var(--cream-dark)';
    b.style.borderColor='transparent';
    b.style.color='var(--text)';
  });
  btn.style.background='var(--terracotta)';
  btn.style.borderColor='var(--terracotta)';
  btn.style.color='#fff';
  const hidden = document.getElementById(targetId);
  if(hidden) hidden.value = btn.dataset.val;
}

function saveGoals(teamId){
  const physGoal = document.getElementById('phys-goal-val')?.value?.trim();
  const teamGoal = document.getElementById('team-goal-val')?.value?.trim();
  const physDiff = document.getElementById('phys-diff')?.value||'medium';
  const errEl    = document.getElementById('goals-error');

  if(!physGoal){ if(errEl) errEl.textContent='Please set a physical goal first.'; return; }
  if(!teamGoal){ if(errEl) errEl.textContent='Please set a teamwork goal too.'; return; }
  if(errEl) errEl.textContent='';

  const team = getTeam(teamId);
  const week = appState.unit.activeWeek;
  const goalId = newUUID();

  const goalEntry = {
    goal_id: goalId,
    week_number: week,
    physical_goal: physGoal,
    physical_difficulty: physDiff,
    teamwork_goal: teamGoal,
    goals_set_at: nowISO(),
  };

  const goals = [...(team.goals||[]).filter(g=>g.week_number!==week), goalEntry];
  updateTeam(teamId,{goals});
  syncToSheets({type:'goal_save', team_id:teamId, ...goalEntry});
  checkAutoBadges(teamId);
  showScreen('team-home',{teamId});
}

function checkinLabel(val){
  const map = {on_track:'On track ✅', sort_of:'Sort of 🟡', need_help:'Need help 🆘'};
  return map[val]||val||'—';
}

function selectTrack(btn, groupId){
  btn.closest('div').querySelectorAll('button[type="button"]').forEach(b=>{
    b.style.background='var(--cream-dark)';
    b.style.borderColor='transparent';
    b.style.color='var(--text)';
  });
  const colours = {on_track:'var(--green-mid)',sort_of:'var(--gold)',need_help:'var(--error)'};
  const col = colours[btn.dataset.val]||'var(--green-mid)';
  btn.style.background=col;
  btn.style.borderColor=col;
  btn.style.color='#fff';
  const hidden = document.getElementById(groupId);
  if(hidden) hidden.value = btn.dataset.val;
}

function saveCheckin(teamId){
  const physCheck = document.getElementById('checkin-phys')?.value;
  const teamCheck = document.getElementById('checkin-team')?.value;
  const note      = document.getElementById('checkin-note')?.value?.trim()||'';
  const errEl     = document.getElementById('checkin-error');

  if(!physCheck){ if(errEl) errEl.textContent='Please choose how you\'re going with your physical goal.'; return; }
  if(!teamCheck){ if(errEl) errEl.textContent='Please choose how you\'re working as a team.'; return; }
  if(errEl) errEl.textContent='';

  const team = getTeam(teamId);
  const week = appState.unit.activeWeek;
  const goals = team.goals||[];
  const gIdx  = goals.findIndex(g=>g.week_number===week);
  if(gIdx<0) return;

  const updated = {...goals[gIdx],
    physical_checkin: physCheck,
    teamwork_checkin: teamCheck,
    checkin_note: note,
    checkin_at: nowISO(),
  };
  const newGoals = [...goals];
  newGoals[gIdx] = updated;
  updateTeam(teamId,{goals:newGoals});
  syncToSheets({type:'goal_save', team_id:teamId, ...updated});
  showScreen('team-home',{teamId});
}

function useStarter(btn, targetId){
  // Highlight selected starter
  btn.closest('[id$="-starters"]')?.querySelectorAll('.starter-btn').forEach(b=>{
    b.style.background='var(--cream-dark)';
    b.style.borderColor='transparent';
  });
  btn.style.background='var(--green-mid)22';
  btn.style.borderColor='var(--green-mid)';
  // Put starter text into the input
  const input = document.getElementById(targetId);
  if(input && input.tagName==='INPUT'){
    input.value = btn.dataset.target ? btn.textContent : '';
    input.placeholder = btn.textContent;
    input.focus();
  }
}

function selectAchieved(btn, groupId){
  btn.closest('div').querySelectorAll('button[type="button"]').forEach(b=>{
    b.style.background='var(--cream-dark)';
    b.style.borderColor='transparent';
    b.style.color='var(--text)';
  });
  const colours = {yes:'var(--green-mid)',partial:'var(--gold)',no:'var(--error)'};
  const col = colours[btn.dataset.val]||'var(--green-mid)';
  btn.style.background=col;
  btn.style.borderColor=col;
  btn.style.color='#fff';
  const hidden = document.getElementById(groupId);
  if(hidden) hidden.value = btn.dataset.val;
}

function selectLP(btn){
  document.querySelectorAll('#lp-options button[type="button"]').forEach(b=>{
    b.style.background='var(--cream-dark)';
    b.style.borderColor='transparent';
    b.style.color='var(--text)';
  });
  btn.style.background='var(--green-mid)';
  btn.style.borderColor='var(--green-mid)';
  btn.style.color='#fff';
  const hidden = document.getElementById('reflect-lp');
  if(hidden) hidden.value = btn.dataset.val;
}

function saveReflection(teamId){
  const physAch = document.getElementById('reflect-phys-ach')?.value;
  const teamAch = document.getElementById('reflect-team-ach')?.value;
  const wellVal = document.getElementById('reflect-well-val')?.value?.trim();
  const hardVal = document.getElementById('reflect-hard-val')?.value?.trim();
  const lpVal   = document.getElementById('reflect-lp')?.value;
  const errEl   = document.getElementById('reflect-error');

  if(!physAch){ if(errEl) errEl.textContent='Did you achieve your physical goal?'; return; }
  if(!wellVal){ if(errEl) errEl.textContent='Please write what went well.'; return; }
  if(!hardVal){ if(errEl) errEl.textContent='Please write what was hard.'; return; }
  if(!teamAch){ if(errEl) errEl.textContent='How did your team do on the teamwork goal?'; return; }
  if(!lpVal)  { if(errEl) errEl.textContent='Please pick a Learner Profile attribute.'; return; }
  if(errEl) errEl.textContent='';

  const team = getTeam(teamId);
  const week = appState.unit.activeWeek;
  const goals = team.goals||[];
  const gIdx  = goals.findIndex(g=>g.week_number===week);
  if(gIdx<0) return;

  const updated = {...goals[gIdx],
    physical_achieved: physAch,
    teamwork_achieved: teamAch,
    reflection_wellbeing: wellVal,
    reflection_challenge: hardVal,
    lp_attribute_shown: lpVal,
    reflection_at: nowISO(),
  };
  const newGoals = [...goals];
  newGoals[gIdx] = updated;
  updateTeam(teamId,{goals:newGoals});
  syncToSheets({type:'goal_save', team_id:teamId, ...updated});

  // Check auto badges
  checkAutoBadges(teamId);
  // Check level-up (reflections count toward unlock conditions)
  checkLevelUp(teamId);

  showScreen('team-home',{teamId});
}

// ─── APPROVE / REJECT CHALLENGES ─────────────
function approveChallenge(teamId, submissionId){
  const team = getTeam(teamId);
  if(!team) return;
  const pending  = team.pendingChallenges||[];
  const sub = pending.find(c=>c.submission_id===submissionId);
  if(!sub) return;

  const approved = [...(team.approvedChallenges||[]), {...sub, status:'approved', approved_at:nowISO()}];
  const newPending = pending.filter(c=>c.submission_id!==submissionId);

  const isPhys = sub.challenge_type==='physical';
  const patch = {
    pendingChallenges: newPending,
    approvedChallenges: approved,
    approvedPhysical:      (team.approvedPhysical||0)      + (isPhys?1:0),
    approvedCollaboration: (team.approvedCollaboration||0) + (isPhys?0:1),
  };
  updateTeam(teamId, patch);
  syncToSheets({type:'challenge_approval', team_id:teamId, submission_id:submissionId,
    status:'approved', approved_at:nowISO()});
  checkAutoBadges(teamId);
  checkLevelUp(teamId);
  renderTeacherDashboard();
}

function showRejectInput(submissionId){
  const el = document.getElementById('reject-input-'+submissionId);
  if(el) el.style.display = el.style.display==='none' ? 'block' : 'none';
}

function rejectChallenge(teamId, submissionId){
  const team = getTeam(teamId);
  if(!team) return;
  const note = document.getElementById('reject-note-'+submissionId)?.value?.trim()||'';
  const newPending = (team.pendingChallenges||[]).filter(c=>c.submission_id!==submissionId);
  updateTeam(teamId,{pendingChallenges:newPending});
  syncToSheets({type:'challenge_approval', team_id:teamId, submission_id:submissionId,
    status:'rejected', teacher_note:note, approved_at:nowISO()});
  renderTeacherDashboard();
}

function selectBadgePick(btn){
  document.querySelectorAll('.badge-pick-btn').forEach(b=>{
    b.style.background='var(--cream-dark)';
    b.style.borderColor='transparent';
  });
  btn.style.background='var(--terracotta)22';
  btn.style.borderColor='var(--terracotta)';
  document.getElementById('award-badge-id').value = btn.dataset.id;
}

function awardBadge(){
  const teamId  = document.getElementById('award-team')?.value;
  const badgeId = document.getElementById('award-badge-id')?.value;
  const note    = document.getElementById('award-note')?.value?.trim()||'';
  const errEl   = document.getElementById('award-error');

  if(!teamId)  { if(errEl) errEl.textContent='Please select a team.'; return; }
  if(!badgeId) { if(errEl) errEl.textContent='Please pick a badge.'; return; }
  if(errEl) errEl.textContent='';

  const def  = SPECIAL_BADGES.find(b=>b.id===badgeId);
  const team = getTeam(teamId);
  if(!def||!team) return;

  const badge = {
    id: newUUID(), badgeDefId:badgeId,
    name:def.name, icon:def.icon, desc:def.desc,
    teacherNote:note, type:'teacher',
    awardedAt:nowISO(),
  };
  const badges = [...(team.badges||[]), badge];
  updateTeam(teamId,{badges});
  syncToSheets({type:'badge_award', team_id:teamId, ...badge});

  // Flag for badge celebration overlay when team next opens their view
  updateTeam(teamId,{badgePending:badge});

  closeModal('modal-award-badge');
  renderTeacherDashboard();
}

// ─── SYNC ────────────────────────────────────
async function doSync(){
  await replayPendingSync();
  const data = await fetchFromSheets();
  if(data){
    // Merge remote config if present
    if(data.config){ setState({unit:{...appState.unit,...data.config}}); }
    renderTeacherDashboard();
  }
}

function saveUnitSetup(){
  const name     = document.getElementById('setup-unit-name')?.value?.trim();
  const grade    = document.getElementById('setup-grade')?.value||'G3';
  const weeks    = parseInt(document.getElementById('setup-weeks')?.value)||4;

  const pw       = document.getElementById('setup-password')?.value?.trim();

  const errEl    = document.getElementById('setup-error');

  if(!name){ if(errEl) errEl.textContent='Please enter a unit name.'; return; }
  if(errEl) errEl.textContent='';

  if(pw) localStorage.setItem('tqTeacherPassword',pw);

  // Build teams
  const teams = [];
  for(let i=0;i<numTeams;i++){
    const tName   = document.getElementById('team-name-'+i)?.value?.trim()||`Team ${i+1}`;
    const tColour = document.getElementById('team-colour-'+i)?.value||TEAM_COLOURS[i%8].hex;
    const rosterRaw = document.getElementById('team-roster-'+i)?.value||'';
    const roster = rosterRaw.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);
    const existing = appState.teams[i];
    teams.push({
      id: existing?.id||newUUID(),
      name: tName,
      colour: tColour,
      roster,
      charterValues: existing?.charterValues||[],
      charterSet: existing?.charterSet||false,
      level: existing?.level||1,
      approvedPhysical: existing?.approvedPhysical||0,
      approvedCollaboration: existing?.approvedCollaboration||0,
      pendingChallenges: existing?.pendingChallenges||[],
      approvedChallenges: existing?.approvedChallenges||[],
      goals: existing?.goals||[],
      badges: existing?.badges||[],
      storyQuote: existing?.storyQuote||null,
      created_at: existing?.created_at||nowISO(),
      last_updated: nowISO(),
    });
  }

  const unit = {
    ...appState.unit,
    name, grade, weeks, appsScriptUrl:scriptUrl,
    activeWeek: appState.unit.activeWeek||1,
  };

  setState({unit, teams});
  syncToSheets({type:'config_update',...unit});
  teams.forEach(t=>syncToSheets({type:'team_setup',team_id:t.id,
    team_name:t.name,team_colour:t.colour,roster:t.roster.join('|'),
    grade, unit_name:name, current_level:t.level,
    created_at:t.created_at, last_updated:t.last_updated}));

  showScreen('teacher-dashboard');
}

// ═══════════════════════════════════════════
//  PART 5 — TEAM STORY, BADGE OVERLAY, FINAL WIRING
// ═══════════════════════════════════════════

// ─── TEAM STORY ───────────────────────────────
function renderTeamStory(id){
  const team = getTeam(id);
  if(!id||!team) return;
  const lv     = LEVELS[team.level-1]||LEVELS[0];
  const goals  = team.goals||[];
  const badges = team.badges||[];
  const charter= team.charterValues||[];
  const icons  = Object.fromEntries(CHARTER_OPTIONS.map(c=>[c.value,c.icon]));

  // Gather LP attributes shown
  const lpShown = [...new Set(goals.filter(g=>g.lp_attribute_shown).map(g=>g.lp_attribute_shown))];

  // Goals summary
  const goalsSet      = goals.filter(g=>g.goals_set_at).length;
  const physAchieved  = goals.filter(g=>g.physical_achieved==='yes').length;
  const teamAchieved  = goals.filter(g=>g.teamwork_achieved==='yes').length;
  const reflections   = goals.filter(g=>g.reflection_at).length;

  const storyQuote = team.storyQuote;

  document.getElementById('story-content').innerHTML=`
    <div id="story-print-area">
      <!-- Header -->
      <div style="background:${team.colour};color:#fff;padding:28px 20px 20px;text-align:center"
        class="no-print-back">
        <button class="back-btn no-print-back" style="color:rgba(255,255,255,.8);margin-bottom:10px"
          onclick="showScreen('team-home',{teamId:'${id}'})">← Back</button>
        <div style="font-size:3rem;margin-bottom:6px">📖</div>
        <h1 style="font-family:'Nunito',sans-serif;font-weight:900;font-size:2rem;margin-bottom:4px">
          ${esc(team.name)}</h1>
        <div style="opacity:.85;font-size:.95rem;margin-bottom:10px">
          ${esc(appState.unit.name||'Team Quest')} · ${appState.unit.grade}</div>
        ${makeLevelBadge(team.level,'rgba(255,255,255,.25)')}
      </div>

      <div style="padding:20px;max-width:600px;margin:0 auto;padding-bottom:60px">

        <!-- Charter -->
        ${charter.length?`
        <div class="card" style="margin-bottom:16px;border-top:4px solid ${team.colour}">
          <div style="font-family:'Nunito',sans-serif;font-weight:900;color:var(--green-dark);
            font-size:1.05rem;margin-bottom:10px">📜 Our Team Values</div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            ${charter.map(v=>`
              <div style="background:${team.colour}22;border:2px solid ${team.colour};
                border-radius:12px;padding:10px 16px;font-weight:700;font-size:.95rem">
                ${icons[v]||'⭐'} ${esc(v)}</div>`).join('')}
          </div>
        </div>`:''}

        <!-- Level Achieved -->
        <div class="card" style="margin-bottom:16px;text-align:center;background:${team.colour}11;
          border:2px solid ${team.colour}44">
          <div style="font-size:2.5rem;margin-bottom:6px">${lv.icon}</div>
          <div style="font-family:'Nunito',sans-serif;font-weight:900;font-size:1.3rem;
            color:var(--green-dark)">Level ${lv.level}: ${lv.name}</div>
          <div style="font-size:.85rem;color:var(--text-light);margin-top:4px">
            Final level achieved this unit</div>
        </div>

        <!-- Stats -->
        <div class="card" style="margin-bottom:16px">
          <div style="font-family:'Nunito',sans-serif;font-weight:900;color:var(--green-dark);
            margin-bottom:12px">📊 Our Unit Stats</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            ${statBox('🏃','Physical Challenges',team.approvedPhysical||0,team.colour)}
            ${statBox('🤝','Collaboration Challenges',team.approvedCollaboration||0,team.colour)}
            ${statBox('🎯','Weeks with Goals',goalsSet,team.colour)}
            ${statBox('🪞','Reflections Done',reflections,team.colour)}
            ${statBox('✅','Physical Goals Achieved',physAchieved,team.colour)}
            ${statBox('💚','Teamwork Goals Achieved',teamAchieved,team.colour)}
          </div>
        </div>

        <!-- Best Quote -->
        ${storyQuote?`
        <div class="card" style="margin-bottom:16px;border-left:5px solid ${team.colour}">
          <div style="font-family:'Nunito',sans-serif;font-weight:800;color:var(--green-dark);
            margin-bottom:8px">💬 Our Best Reflection</div>
          <div style="font-size:1rem;font-style:italic;line-height:1.6;color:var(--text)">
            "${esc(storyQuote)}"</div>
        </div>`:''}

        <!-- Badges -->
        ${badges.length?`
        <div class="card" style="margin-bottom:16px">
          <div style="font-family:'Nunito',sans-serif;font-weight:900;color:var(--green-dark);
            margin-bottom:12px">🏅 Badges Earned</div>
          <div style="display:flex;flex-wrap:wrap;gap:12px">
            ${badges.map(b=>`
              <div style="text-align:center;min-width:60px">
                <div style="font-size:2rem">${b.icon||'🏅'}</div>
                <div style="font-size:.7rem;font-weight:700;color:var(--green-dark);
                  margin-top:3px;line-height:1.2">${esc(b.name)}</div>
              </div>`).join('')}
          </div>
        </div>`:''}

        <!-- IB LP Attributes -->
        ${lpShown.length?`
        <div class="card" style="margin-bottom:16px">
          <div style="font-family:'Nunito',sans-serif;font-weight:900;color:var(--green-dark);
            margin-bottom:10px">🌍 IB Learner Profile — We Demonstrated</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            ${lpShown.map(lp=>`
              <span style="background:var(--green-mid)22;border:1px solid var(--green-mid);
                border-radius:99px;padding:6px 14px;font-size:.85rem;font-weight:600;
                color:var(--green-dark)">${esc(lp)}</span>`).join('')}
          </div>
        </div>`:''}

        <!-- Reflection Highlights -->
        ${goals.filter(g=>g.reflection_wellbeing).length?`
        <div class="card" style="margin-bottom:16px">
          <div style="font-family:'Nunito',sans-serif;font-weight:900;color:var(--green-dark);
            margin-bottom:10px">📝 Our Weekly Reflections</div>
          ${goals.filter(g=>g.reflection_wellbeing).map(g=>`
            <div style="border-left:3px solid ${team.colour};padding:8px 12px;margin-bottom:10px">
              <div style="font-size:.72rem;font-weight:700;color:var(--text-light);margin-bottom:4px">
                WEEK ${g.week_number}</div>
              <div style="font-size:.88rem;font-style:italic;color:var(--text);line-height:1.5">
                "${esc(g.reflection_wellbeing)}"</div>
            </div>`).join('')}
        </div>`:''}

        <!-- Print / Share -->
        <div style="display:flex;gap:10px;margin-top:8px" class="no-print-back">
          <button class="btn btn-primary" style="flex:1" onclick="window.print()">
            🖨️ Print / Save as PDF</button>
          <button class="btn btn-secondary" style="flex:1"
            onclick="showScreen('team-home',{teamId:'${id}'})">← Back</button>
        </div>

      </div>
    </div>`;
}

function statBox(icon, label, value, colour){
  return `<div style="background:${colour}11;border-radius:10px;padding:14px 10px;text-align:center">
    <div style="font-size:1.4rem;margin-bottom:4px">${icon}</div>
    <div style="font-family:'Nunito',sans-serif;font-weight:900;font-size:1.5rem;color:var(--green-dark)">${value}</div>
    <div style="font-size:.7rem;color:var(--text-light);margin-top:2px;line-height:1.3">${label}</div>
  </div>`;
}

// ─── BADGE AWARD OVERLAY ─────────────────────
function triggerBadgeOverlay(badge, teamColour){
  const overlay = document.getElementById('overlay-badge');
  overlay.style.display='flex';
  document.getElementById('overlay-badge-content').innerHTML=`
    <div style="animation:bounceIn .5s ease;font-size:5rem;margin-bottom:12px">${badge.icon||'🏅'}</div>
    <h1 style="font-family:'Nunito',sans-serif;font-weight:900;color:#fff;font-size:1.8rem;margin-bottom:8px">
      New Badge!</h1>
    <div style="font-family:'Nunito',sans-serif;font-weight:900;color:#fff;font-size:1.5rem;margin-bottom:8px">
      ${esc(badge.name)}</div>
    <p style="color:rgba(255,255,255,.85);font-size:.95rem;margin-bottom:${badge.teacherNote?'8px':'24px'};max-width:280px;line-height:1.5">
      ${esc(badge.desc||'')}</p>
    ${badge.teacherNote?`
    <div style="background:rgba(255,255,255,.15);border-radius:12px;padding:12px 16px;
      margin-bottom:20px;max-width:300px;font-style:italic;color:rgba(255,255,255,.9);font-size:.9rem">
      💬 "${esc(badge.teacherNote)}"</div>`:''}
    <button class="btn" style="background:#fff;color:var(--green-dark);font-size:1.05rem;padding:16px 32px"
      onclick="document.getElementById('overlay-badge').style.display='none'">
      Amazing! 🎉</button>`;
}

// selectTeam is fully defined above — badge + level-up handling included.

// ─── INIT ─────────────────────────────────────
function init(){
  loadState();
  appState.teacherAuth = sessionStorage.getItem('tqTeacherAuth')==='true';
  // Close modals on overlay click
  document.querySelectorAll('.modal-overlay').forEach(mo=>{
    mo.addEventListener('click',e=>{
      if(e.target===mo) mo.classList.remove('open');
    });
  });
  showScreen('landing');
}

document.addEventListener('DOMContentLoaded', init);
</script>

/* ── ANIMATIONS ── */
@keyframes confettiFall{

}

  0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}
}
